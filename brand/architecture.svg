<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#080e1c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151f36"/>
      <stop offset="100%" stop-color="#0f1730"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b7ca8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="700" fill="url(#bg)"/>
  <circle cx="820" cy="80" r="180" fill="#22d3ee" opacity="0.05"/>
  <circle cx="120" cy="620" r="200" fill="#34d399" opacity="0.05"/>

  <!-- Title -->
  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#eef4ff">📡 NasAnySim 是怎么工作的</text>
  <text x="480" y="70" text-anchor="middle" font-size="13" fill="#93a8cc">插在 NAS 上的 4G 模块 → 变成你的私人电话和短信</text>

  <!-- ================= LAYER 1: 你用 (顶部) ================= -->
  <rect x="40" y="100" width="880" height="150" rx="16" fill="url(#card)" stroke="#1e2c4a" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="128" font-size="12" font-weight="700" fill="#22d3ee">📱 第 1 层 · 你用</text>

  <!-- iPhone -->
  <g>
    <rect x="70" y="142" width="150" height="92" rx="12" fill="rgba(8,51,68,0.35)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="145" y="176" text-anchor="middle" font-size="30">📱</text>
    <text x="145" y="202" text-anchor="middle" font-size="12" font-weight="600" fill="#c8f4ff">手机（iPhone）</text>
    <text x="145" y="220" text-anchor="middle" font-size="9" fill="#7fb8cc">添加到主屏幕</text>
  </g>

  <!-- Arrow -->
  <line x1="220" y1="188" x2="280" y2="188" stroke="#4a5e85" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- Any browser -->
  <g>
    <rect x="285" y="142" width="220" height="92" rx="12" fill="rgba(8,51,68,0.35)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="395" y="176" text-anchor="middle" font-size="30">🌐</text>
    <text x="395" y="202" text-anchor="middle" font-size="12" font-weight="600" fill="#c8f4ff">任何浏览器</text>
    <text x="395" y="220" text-anchor="middle" font-size="9" fill="#7fb8cc">安卓 / 电脑 / 平板</text>
  </g>

  <!-- 你能做什么 -->
  <g>
    <rect x="530" y="142" width="370" height="92" rx="12" fill="rgba(6,78,59,0.25)" stroke="#34d399" stroke-width="1.5"/>
    <text x="715" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#b8f5d0">随时随地，打开网页就能：</text>
    <text x="715" y="194" text-anchor="middle" font-size="11" fill="#a5e0bf">💬 收发短信　📞 打电话　🎙 听通话录音</text>
    <text x="715" y="216" text-anchor="middle" font-size="11" fill="#a5e0bf">🔔 来电话/短信会提醒，App 关着也能收到</text>
  </g>

  <!-- Down arrow -->
  <line x1="480" y1="250" x2="480" y2="290" stroke="#4a5e85" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="495" y="274" font-size="10" fill="#7a90b8">加密 HTTPS 连接</text>

  <!-- ================= LAYER 2: NAS (中间) ================= -->
  <rect x="40" y="295" width="880" height="170" rx="16" fill="url(#card)" stroke="#1e2c4a" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="323" font-size="12" font-weight="700" fill="#34d399">🖥️ 第 2 层 · 你家 NAS 上运行</text>

  <!-- NAS box -->
  <g>
    <rect x="70" y="340" width="340" height="108" rx="14" fill="rgba(6,78,59,0.35)" stroke="#34d399" stroke-width="2"/>
    <text x="240" y="372" text-anchor="middle" font-size="26">🖥️</text>
    <text x="240" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#b8f5d0">NasAnySim 网关</text>
    <text x="240" y="418" text-anchor="middle" font-size="10" fill="#7fd6a4">短信 / 通话状态机 / 录音 / 推送提醒</text>
    <text x="240" y="436" text-anchor="middle" font-size="9" fill="#5fa884">一个小容器，24 小时开机</text>
  </g>

  <!-- Caddy -->
  <g>
    <rect x="440" y="340" width="220" height="108" rx="14" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="550" y="372" text-anchor="middle" font-size="26">🛡️</text>
    <text x="550" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#ffe4a8">Caddy 安全网关</text>
    <text x="550" y="418" text-anchor="middle" font-size="10" fill="#d4a44f">HTTPS 加密 + 登录验证</text>
    <text x="550" y="436" text-anchor="middle" font-size="9" fill="#b08a3f">保护你的电话不被别人访问</text>
  </g>

  <!-- TURN -->
  <g>
    <rect x="690" y="340" width="210" height="108" rx="14" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="795" y="372" text-anchor="middle" font-size="26">🔀</text>
    <text x="795" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#ffd9a8">TURN 语音中继</text>
    <text x="795" y="418" text-anchor="middle" font-size="10" fill="#e0a85f">让通话穿透你家网络</text>
    <text x="795" y="436" text-anchor="middle" font-size="9" fill="#c08a45">在外面也能正常打电话</text>
  </g>

  <!-- Down arrows -->
  <line x1="240" y1="448" x2="240" y2="500" stroke="#4a5e85" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="550" y1="448" x2="550" y2="500" stroke="#4a5e85" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)" opacity="0.3"/>
  <text x="250" y="480" font-size="10" fill="#7a90b8">AT 指令 / 语音</text>

  <!-- ================= LAYER 3: 硬件 (底部) ================= -->
  <rect x="40" y="505" width="880" height="150" rx="16" fill="url(#card)" stroke="#1e2c4a" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="533" font-size="12" font-weight="700" fill="#fb7185">📶 第 3 层 · 底下接的硬件</text>

  <!-- SIM -->
  <g>
    <rect x="70" y="550" width="250" height="88" rx="12" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="195" y="584" text-anchor="middle" font-size="28">💳</text>
    <text x="195" y="610" text-anchor="middle" font-size="12" font-weight="700" fill="#ffc1cb">手机 SIM 卡</text>
    <text x="195" y="628" text-anchor="middle" font-size="9" fill="#e08a96">你自己的手机号</text>
  </g>

  <!-- Module -->
  <g>
    <rect x="360" y="550" width="260" height="88" rx="12" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="490" y="584" text-anchor="middle" font-size="28">📻</text>
    <text x="490" y="610" text-anchor="middle" font-size="12" font-weight="700" fill="#ffc1cb">DJI / 百旺 4G 模块</text>
    <text x="490" y="628" text-anchor="middle" font-size="9" fill="#e08a96">USB 插在 NAS 上，接收信号</text>
  </g>

  <!-- Storage -->
  <g>
    <rect x="660" y="550" width="240" height="88" rx="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="780" y="584" text-anchor="middle" font-size="28">💾</text>
    <text x="780" y="610" text-anchor="middle" font-size="12" font-weight="700" fill="#d9c8ff">NAS 硬盘</text>
    <text x="780" y="628" text-anchor="middle" font-size="9" fill="#b49ae8">短信 / 录音都存在这里</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="670" width="960" height="30" fill="#060a14"/>
  <text x="480" y="690" text-anchor="middle" font-size="10" fill="#5b6b8c">NasAnySim · 自托管蜂窝网关 · 你的 SIM 卡，随时随地上网用</text>
</svg>
